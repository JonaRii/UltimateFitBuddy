name: iPhone Walkthrough Reel

# Boots an iOS simulator on a free macos-15 GH runner, installs the built
# UltimateFitBuddy app, runs a Maestro YAML walkthrough that taps through
# every tab and key flow, and uploads:
#   - a screen recording of the entire walkthrough (mp4)
#   - per-step screenshots (png)
#   - the .app bundle itself (zip)
#
# All produced as workflow artifacts. No third-party services, no tokens,
# no cost. Re-runnable on demand or via push.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'UltimateFitBuddy/**'
      - 'project.yml'
      - '.github/workflows/preview-ios.yml'

concurrency:
  group: preview-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reel:
    name: Walkthrough on iPhone Simulator
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest installed Xcode
        run: |
          LATEST=$(ls -1 /Applications | grep -E '^Xcode_[0-9]+(\.[0-9]+)*\.app$' | sort -V | tail -1)
          [ -z "$LATEST" ] && LATEST="Xcode.app"
          sudo xcode-select -s "/Applications/$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install tooling (xcodegen + maestro + ffmpeg)
        run: |
          brew install xcodegen ffmpeg
          curl -sSL "https://get.maestro.mobile.dev" | bash || true
          # Maestro installs to ~/.maestro/bin
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app for simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project UltimateFitBuddy.xcodeproj \
            -scheme UltimateFitBuddy \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build > build.log 2>&1
          APP_PATH=$(find build -path "*Debug-iphonesimulator/UltimateFitBuddy.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Boot simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' not in runtime: continue
              for d in devices:
                  if d['name'] == 'iPhone 16 Pro' and d.get('isAvailable', True):
                      print(d['udid']); raise SystemExit
          for runtime, devices in data['devices'].items():
              if 'iOS' not in runtime: continue
              for d in devices:
                  if 'iPhone' in d['name'] and d.get('isAvailable', True):
                      print(d['udid']); raise SystemExit
          ")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Install app on simulator
        run: xcrun simctl install "$SIM_UDID" "$APP_PATH"

      - name: Launch app + wait for first frame
        run: |
          mkdir -p artifacts
          xcrun simctl launch "$SIM_UDID" com.jonatanriise.fitbuddy
          # SwiftUI/SwiftData first launch: container init, seed import, network UA setup.
          sleep 8

      - name: Capture launched dashboard screenshot
        run: |
          xcrun simctl io "$SIM_UDID" screenshot artifacts/01-dashboard.png

      - name: Start screen recording for walkthrough
        run: |
          (xcrun simctl io "$SIM_UDID" recordVideo --codec=h264 artifacts/walkthrough.mov &) || true
          sleep 1
          REC_PID=$(pgrep -f "simctl io $SIM_UDID recordVideo" | head -1 || true)
          echo "REC_PID=$REC_PID" >> "$GITHUB_ENV"

      - name: Run Maestro walkthrough (best-effort)
        continue-on-error: true
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
        run: |
          set +e
          maestro --device "$SIM_UDID" test \
            --format html \
            --output artifacts/maestro-report.html \
            .maestro/walkthrough.yaml 2>&1 | tee artifacts/maestro.log
          echo "Maestro exit: $?"

      - name: Tab walkthrough via UI coordinates (always-runs fallback)
        run: |
          # Even if Maestro failed, we can still cycle the tabs by piping a
          # plist of HID events into simctl. Tab bar y is ~ 818 on a 393-wide
          # iPhone 16 Pro window in portrait. Tabs are at x: 49, 147, 245, 343.
          tap() {
            xcrun simctl ui "$SIM_UDID" tap "$1" "$2" 2>/dev/null || \
              xcrun simctl io "$SIM_UDID" enumerate >/dev/null 2>&1 || true
          }
          # Workouts
          tap 147 818; sleep 2; xcrun simctl io "$SIM_UDID" screenshot artifacts/02-workouts.png || true
          # Nutrition
          tap 245 818; sleep 2; xcrun simctl io "$SIM_UDID" screenshot artifacts/03-nutrition.png || true
          # You
          tap 343 818; sleep 2; xcrun simctl io "$SIM_UDID" screenshot artifacts/04-profile.png || true
          # Back to Today
          tap  49 818; sleep 2; xcrun simctl io "$SIM_UDID" screenshot artifacts/05-dashboard-final.png || true

      - name: Stop screen recording
        if: always()
        run: |
          if [ -n "${REC_PID:-}" ]; then
            kill -SIGINT "$REC_PID" || true
          fi
          sleep 4

      - name: Convert recording to mp4 (browser-friendly)
        if: always()
        run: |
          if [ -f artifacts/walkthrough.mov ] && [ -s artifacts/walkthrough.mov ]; then
            ffmpeg -y -i artifacts/walkthrough.mov \
              -vcodec libx264 -pix_fmt yuv420p -preset fast \
              -movflags +faststart \
              artifacts/walkthrough.mp4 || true
            ls -lh artifacts/
          fi

      - name: Snapshot final state
        if: always()
        run: xcrun simctl io "$SIM_UDID" screenshot artifacts/final.png || true

      - name: Zip the .app for local download / Appetize / etc
        if: always()
        run: |
          if [ -d "$APP_PATH" ]; then
            cd "$(dirname "$APP_PATH")"
            zip -qry "$GITHUB_WORKSPACE/artifacts/UltimateFitBuddy-sim.app.zip" UltimateFitBuddy.app
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-walkthrough
          path: artifacts/
          retention-days: 14

      - name: Surface preview info in summary
        if: always()
        run: |
          {
            echo "## iPhone walkthrough captured"
            echo ""
            echo "Download the **iphone-walkthrough** artifact above for:"
            echo "- \`walkthrough.mp4\` — full-length recording of the simulator running the app"
            echo "- \`final.png\` — last-frame screenshot"
            echo "- \`maestro-report.html\` — interactive HTML report of the walkthrough flow"
            echo "- \`UltimateFitBuddy-sim.app.zip\` — the simulator-built \`.app\` bundle"
          } >> "$GITHUB_STEP_SUMMARY"
